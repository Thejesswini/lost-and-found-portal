
<div class="register-box">
  <div class="register-container">
    <h1 class="title">Create Account</h1>
    <p class="subtitle">Hello from the LostAndFound community!</p>

    <form class="register-form" [formGroup]="regForm" (ngSubmit)="register()">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name" required formControlName="name"/>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required formControlName="email"/>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" required formControlName="password"/>
      </div>

      <button type="submit" class="register-btn">Register</button>
    </form>

    <p class="login-text">Already have an account? <a href="../login">Login</a></p>
  </div>
</div>
