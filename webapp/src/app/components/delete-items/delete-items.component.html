<div class="delete-items-container" *ngIf="showInput; else quickDelete">
  <h3>Delete Item</h3>
  <form (ngSubmit)="deleteItem()">
    <input type="text" [(ngModel)]="itemId" name="itemId" placeholder="Item ID" required />
    <button type="submit" class="delete-btn">
      <i class="fa-solid fa-trash"></i> Delete Item
    </button>
  </form>
</div>


<ng-template #quickDelete>
  <button (click)="deleteItem()" class="delete-btn">
    <i class="fa-solid fa-trash"></i>
  </button>
</ng-template>
